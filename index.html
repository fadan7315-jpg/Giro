    error ? say(error.message) : render();
  };
}

let cart = [];
async function salesView() {
  const [{ data: prods, error: e1 }, { data: hist }] = await Promise.all([
    sb.from("products").select("id,name,selling_price,quantity").eq("business_id", curBiz).gt("quantity", 0).order("name"),
    sb.from("sales").select("id,total,created_at").eq("business_id", curBiz).order("created_at", { ascending: false }).limit(10)]);
  if (e1) return say(e1.message);
  const byId = Object.fromEntries((prods || []).map(p => [p.id, p]));
  const opts = (prods || []).map(p => `<option value="${p.id}">${esc(p.name)} ($${esc(p.selling_price)}) · ${esc(p.quantity)}</option>`).join("");
  const hh = (hist || []).map(h => `<button class="link" data-sale="${h.id}">${new Date(h.created_at).toLocaleString()} · $${esc(h.total)}</button>`).join("");
  cart = [];
  $("view").innerHTML = `<h2>${t("sales")}</h2>
    ${opts ? `<label>${t("pick")}</label><select id="sp">${opts}</select>
    <label>${t("qty")}</label><input id="sq" type="number" min="1" step="1" value="1" inputmode="numeric">
    <button id="sadd">${t("addline")}</button>` : `<p style="color:var(--mut)">${t("nostock")}</p>`}
    <div id="cart"></div>
    <label>${t("disc")}</label><input id="sd" type="number" min="0" step="0.01" value="0" inputmode="decimal">
    <label>${t("method")}</label><select id="sm"><option value="cash">Cash</option><option value="evc_plus">EVC Plus</option><option value="other">${t("other")}</option></select>
    <p id="tot" style="font-size:20px;color:var(--gold)"></p>
    <button id="sdone">${t("done")}</button><button class="link" id="bk">${t("back")}</button>
    <h3>${t("recent")}</h3>${hh}`;
  $("bk").onclick = render;
  const calc = () => { const sub = cart.reduce((a, l) => a + l.q * Number(byId[l.id].selling_price), 0); const d = parseFloat($("sd").value) || 0; return { sub, d, tot: sub - d }; };
  const draw = () => {
    $("cart").innerHTML = cart.map((l, i) => `<div>${esc(byId[l.id].name)} × ${l.q} = $${(l.q * Number(byId[l.id].selling_price)).toFixed(2)}<button class="link" data-rm="${i}">${t("del")}</button></div>`).join("");
    $("tot").textContent = `${t("tot")}: $${calc().tot.toFixed(2)}`;
    document.querySelectorAll("button[data-rm]").forEach(b => b.onclick = () => { cart.splice(+b.dataset.rm, 1); draw(); });
  };
  draw();
  $("sd").oninput = draw;
  if ($("sadd")) $("sadd").onclick = () => {
    const id = $("sp").value, q = parseInt($("sq").value, 10);
    if (!(q > 0)) return say(t("bad"));
    const have = cart.find(l => l.id === id), already = have ? have.q : 0;
    if (already + q > Number(byId[id].quantity)) return say(t("overstock"));
    say(""); have ? (have.q += q) : cart.push({ id, q }); draw();
  };
  document.querySelectorAll("button[data-sale]").forEach(b => b.onclick = () => receiptView(b.dataset.sale));
  $("sdone").onclick = async () => {
    if (!cart.length) return say(t("cartempty"));
    const c = calc(); if (c.d < 0 || c.d > c.sub) return say(t("baddisc"));
    const { data, error } = await sb.rpc("create_sale", { p_business: curBiz, p_items: cart.map(l => ({ product_id: l.id, quantity: l.q })), p_discount: c.d, p_method: $("sm").value });
    if (error) return say(/inactive/.test(error.message) ? t("ended") : /insufficient/.test(error.message) ? t("nostockerr") + error.message.split(": ")[1] : error.message);
    receiptView(data);
  };
}
async function receiptView(id) {
  const { data: sale } = await sb.from("sales").select("total,subtotal,discount,payment_method,created_at").eq("id", id).single();
  const { data: items } = await sb.from("sale_items").select("product_name,quantity,unit_price,line_total").eq("sale_id", id);
  if (!sale) return say(t("err"));
  $("view").innerHTML = `<h2>${t("receipt")}</h2><p style="color:var(--mut)">${new Date(sale.created_at).toLocaleString()} · ${esc(sale.payment_method)}</p>
    ${(items || []).map(i => `<div>${esc(i.product_name)} × ${esc(i.quantity)} = $${esc(i.line_total)}</div>`).join("")}
    <p>${t("disc")}: $${esc(sale.discount)}</p><p style="font-size:20px;color:var(--gold)">${t("tot")}: $${esc(sale.total)}</p>
    <button id="prt">${t("print")}</button><button class="link" id="bk">${t("back")}</button>`;
  $("prt").onclick = () => window.print(); $("bk").onclick = salesView;
}

  $("bk").onclick = render;
  document.querySelectorAll("button[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(t("askdel"))) return;

  $("padd").onclick = async () => {
    const name = $("pn").value.trim(), pb = parseFloat($("pb").value), ps = parseFloat($("ps").value), pq = parseFloat($("pq").value);
    if (name.length < 1 || name.length > 120 || !(pb >= 0) || !(ps >= 0) || !(pq >= 0)) return say(t("bad"));
    const { error } = await sb.from("products").insert({ business_id: curBiz, name, purchase_price: pb, selling_price: ps, quantity: pq });
    error ? say(error.code === "42501" ? t("ended") : error.message) : invView();
  };
}
async function payView() {
  const { data: rows } = await sb.from("payments").select("transaction_ref,status,created_at").eq("business_id", curBiz).order("created_at", { ascending: false });
  const list = (rows || []).map(r => `<li>${esc(r.transaction_ref)} · ${t("st_" + r.status)}</li>`).join("");
  $("view").innerHTML = `<h2>${t("pay")}</h2><p style="color:var(--mut)">${t("payInstr")}</p>
    <label>${t("ref")}</label><input id="r" autocapitalize="characters">
    <button id="snd">${t("send")}</button><button class="link" id="bk">${t("back")}</button>
    ${list ? `<h3>${t("hist")}</h3><ul>${list}</ul>` : ""}`;
  $("bk").onclick = render;
  $("snd").onclick = async () => {
    const ref = $("r").value.trim().toUpperCase();
    if (ref.length < 4 || ref.length > 64) return say(t("ref"));
    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from("payments").insert({ business_id: curBiz, submitted_by: user.id, amount_usd: 5, transaction_ref: ref });
    if (error) return say(error.code === "23505" ? t("dup") : error.message);
    await payView(); say(t("sent"), true);
  };
}
async function adminView() {
  const { data: rows, error } = await sb.from("payments").select("id,transaction_ref,amount_usd,created_at,businesses(name)").eq("status", "submitted").order("created_at");
  if (error) return say(error.message);
  const list = (rows || []).map(r => `<div style="border:1px solid #d4af3744;border-radius:10px;padding:10px;margin:8px 0">
    <b>${esc(r.businesses && r.businesses.name)}</b><br>${esc(r.transaction_ref)} · $${esc(r.amount_usd)}
    <button data-id="${r.id}" data-a="1">${t("ok")}</button><button data-id="${r.id}" data-a="0" style="background:var(--red);color:#fff">${t("no")}</button></div>`).join("");
  $("view").innerHTML = `<h2>${t("admin")}</h2>${list || `<p>${t("none")}</p>`}<button class="link" id="out">${t("out")}</button>`;
  $("out").onclick = async () => { await sb.auth.signOut(); render(); };
  document.querySelectorAll("button[data-id]").forEach(b => b.onclick = async () => {
    const { error } = await sb.rpc("review_payment", { p_id: b.dataset.id, p_approve: b.dataset.a === "1" });
    error ? say(error.message) : adminView();
  });
}
function bizView() {
  $("view").innerHTML = `<label>${t("bizname")}</label><input id="b"><button id="mk">${t("create")}</button>`;
  $("mk").onclick = async () => {
    const n = $("b").value.trim(); if (n.length < 2) return say(t("bizname"));
    const { error } = await sb.rpc("create_business", { p_name: n });
    error ? say(error.message) : render();
  };
}
$("lang").onclick = () => { lang = lang === "so" ? "en" : "so"; localStorage.setItem("giro_lang", lang); render(); };
$("theme").onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light"; };
sb.auth.onAuthStateChange(() => {});
render();
</script>
</body>
</html>
